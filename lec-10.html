<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>collapse and pagination</title>
    <!-- bootstrap for css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <!-- create pagination -->
    <h3>This is pagination</h3>
    <div class="bg-dark">
        <ul class="pagination py-3 justify-content-center">
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">4</a></li>
            <li class="page-item"><a class="page-link" href="#">5</a></li>
        </ul>
    </div>

    <!-- create collapse -->
    <h3>This is collapse</h3>
    <div>
        <a href="#demo" data-bs-toggle="collapse">Learn More</a>

        <div id="demo" class="collapse">
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusantium delectus quod maxime. Deserunt sit
                ut dignissimos distinctio non, illum similique!
            </p>
        </div>
    </div>


    <!-- bootstrap for js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
