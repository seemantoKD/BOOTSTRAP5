<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & spacing: mergin,padding</title>
    <!-- bootstrap for css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <section class="card-section">
        <div class="title text-center mb-3">
            <h3 class="fw-bolder">Profile</h3>
        </div>

        <div class="row">
            <div class="col-lg-3">
                <div class="card bg-danger text-light text-center">
                    <div class="card-body">
                        <h4 class="card-title">Github Account</h4>
                        <p class="card-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, veritatis!</p>
                        <a class="card-link stretched-link" href="https://github.com/seemantoKD" target="_blank">click here</a>
                    </div>
                    <img class="card-img-bottom" src="https://avatars.githubusercontent.com/u/194864277?v=4" alt="photo">
                </div>
            </div>
        </div>
    </section>

    <!-- bootstrap for js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
