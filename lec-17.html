<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Design</title>
    <!-- bootstrap for css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <h1>User Registration</h1>

    <form class="p-3 bg-danger text-white w-50">
        <div class="mb-3 form-floating">
            <label for="name" class="form-label">Name: </label>
            <input type="text" id="name" class="form-control">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email: </label>
            <input type="email" id="email" class="form-control">
            <div class="form-text">
                Your Email will remain private. We will not share with anyone.
            </div>
        </div>

        <div class="mb-3">
            <div class="form-check-inline">
                <input type="radio" class="form-check-input" id="male">
                <label for="male">Male</label>
            </div>

            <div class="form-check-inline">
                <input type="radio" class="form-check-input" id="female">
                <label for="female">Female</label>
            </div>

            <!-- checkbox starts here -->
            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="tnc">
                    <label for="tnc">Accepts Terms and conditions</label>
                </div>
            </div>
            <!-- checkbox ends here -->

            <!-- dropdown starts here -->
            <div class="mb-3">
                <label for="department">Department</label>
                <select name="department" id="department" class="form-select-inline">
                    <option value="cse">CSE</option>
                    <option value="eee">EEE</option>
                    <option value="bba" selected>BBA</option>
                </select>
            </div>
            <!-- dropdown ends here -->

            <div class="mb-3">
                <button class="btn btn-info">Submit</button>
            </div>
        </div>
    </form>

    <!-- bootstrap for js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
