<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- bootstrap for css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body class="p-3">
    <h1>Welcome to bootstrap5</h1>
    <table class="table table-bordered text-center table-hover">
        <thead>
            <tr class="table-primary">
                <th>Qualification</th>
                <th>Institution</th>
                <th>Passing Year</th>
                <th>CGPA</th>
            </tr>
        </thead>

        <tbody>
            <tr class="table-success">
                <td>SSC</td>
                <td>Chhatak Govt. Bohumukhi Model High School</td>
                <td>2021</td>
                <td>4.83</td>
            </tr>

            <tr>
                <td>HSC</td>
                <td>Madan Mohon College</td>
                <td>2023</td>
                <td>4.44</td>
            </tr>

            <tr>
                <td>BSC</td>
                <td class="table-danger">Metropolitan University</td>
                <td>2023-present</td>
                <td>N/A</td>
            </tr>
        </tbody>
    </table>

    <!-- bootstrap for js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!-- 
    learning: 
        1. table class in table tag
        2. table-bordered in table tag
        3. table-hover class in table tag
        4. table-striped class in table tag
        5. table-active class
-->
